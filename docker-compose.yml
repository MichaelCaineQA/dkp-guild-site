# Локальная инфраструктура для разработки.
# Прод-окружение разворачивается отдельно — см. docs/PLAN.md, раздел 8.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dkp
      POSTGRES_PASSWORD: dkp
      POSTGRES_DB: dkp
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dkp -d dkp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
