services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Укажите POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Укажите POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Миграции запускаются отдельно после резервной копии, до рестарта API.
    command: ['node', 'dist/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Укажите DATABASE_URL}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Укажите SESSION_SECRET}
      CHECKIN_ENC_KEY: ${CHECKIN_ENC_KEY:?Укажите CHECKIN_ENC_KEY}
      ADMIN_LOGIN: ${ADMIN_LOGIN:?Укажите ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Укажите ADMIN_PASSWORD}
      # Оба поля можно оставить пустыми и настроить Discord после установки.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_CALLBACK_URL: ${DISCORD_CALLBACK_URL:-${PUBLIC_WEB_URL:-https://${WEB_HOST}}/api/auth/discord/callback}
      WEB_URL: ${PUBLIC_WEB_URL:-https://${WEB_HOST}}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: '1'
      SCREENSHOT_DIR: /app/uploads/screenshots
    volumes:
      - screenshot-data:/app/uploads/screenshots
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEB_HOST: ${WEB_HOST:?Укажите WEB_HOST}
      API_HOST: ${API_HOST:?Укажите API_HOST}
      CADDY_TLS: ${CADDY_TLS:-}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
volumes:
  db-data:
  screenshot-data:
  caddy-data:
  caddy-config:
