packages:
  - 'apps/*'
  - 'packages/*'

# Родители пока фиксируют уязвимые версии. Совместимость проверяется build,
# Prisma generate/migrate и контрактами HTTP; исключений audit нет (#171).
overrides:
  'next>postcss': '^8.5.32'
  '@prisma/config>deepmerge-ts': '^8.0.0'

# Разрешённые postinstall-скрипты (pnpm 12 по умолчанию блокирует все)
allowBuilds:
  '@scarf/scarf': false # Не запускаем необязательный telemetry postinstall Swagger UI
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  core-js: true
