name: Infrastructure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Deployment dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows (including Deploy, without server secrets)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Validate Compose and shell scripts
        run: |
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.edge.yml config --quiet
          docker compose -f docker-compose.monitoring.yml config --quiet
          docker compose --profile alerts -f docker-compose.monitoring.yml config --quiet
          docker run --rm -v "$PWD/Caddyfile.edge:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --validate
          sh -n scripts/deploy-prod.sh
          sh -n scripts/backup-prod.sh
          sh -n scripts/smoke-prod.sh
          sh -n scripts/select-production-tag.sh
          sh -n scripts/monitoring/kuma-setup.sh
          sh -n scripts/monitoring/smoke-kuma.sh
          # Стенд скриншотов работает только на Windows — здесь проверяется лишь синтаксис.
          bash -n scripts/dev-screenshot.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and smoke-test production stack with local HTTPS
        run: sh scripts/smoke-prod.sh

  monitoring:
    name: Uptime Kuma provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit-test the setup script and the alert relay
        run: node --test scripts/monitoring/*.test.mjs
      - name: Provision a real Uptime Kuma with the setup script
        run: sh scripts/monitoring/smoke-kuma.sh
