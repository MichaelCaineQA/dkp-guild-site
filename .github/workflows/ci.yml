name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dkp
          POSTGRES_PASSWORD: dkp
          POSTGRES_DB: dkp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dkp -d dkp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://dkp:dkp@127.0.0.1:5432/dkp_test?schema=public
    steps:
      - uses: actions/checkout@v4

      # Версию pnpm берёт из поля packageManager в package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dkp/api db:generate

      - name: Validate migrations on test database
        run: pnpm --filter @dkp/api exec prisma migrate deploy

      # До typecheck/build: shared/dist ещё нет в свежем checkout.
      - name: Seed fresh test database
        env:
          NODE_ENV: test
        run: |
          pnpm db:seed
          pnpm db:seed:test

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Core coverage (80%)
        run: pnpm test:coverage

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Прямой запуск: Turbo strict env не пропускает произвольные переменные.
      - name: PostgreSQL integration tests
        env:
          ONBOARDING_TEST_DATABASE_URL: postgresql://dkp:dkp@127.0.0.1:5432/dkp_test?schema=public
        run: pnpm --filter @dkp/api exec jest --runInBand --testPathPattern=database.spec.ts

      # Отдельный сервер: управляемая задержка COMMIT не затрагивает общую БД.
      - name: PostgreSQL delayed commit regression
        env:
          BIDS_COMMIT_TEST_DATABASE_URL: postgresql://dkp:dkp@127.0.0.1:5433/dkp_commit_test?schema=public
        run: |
          container_name="dkp-bid-commit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -fv "$container_name" >/dev/null' EXIT
          docker run -d --name "$container_name" -p 127.0.0.1:5433:5432 \
            --health-cmd "pg_isready -U dkp -d dkp_commit_test" \
            --health-interval 1s --health-timeout 3s --health-retries 30 \
            -e POSTGRES_USER=dkp -e POSTGRES_PASSWORD=dkp -e POSTGRES_DB=dkp_commit_test \
            postgres:16-alpine \
            -c synchronous_standby_names=dkp_bid_commit_test -c synchronous_commit=off
          for ((probe_attempt=0; probe_attempt<30; probe_attempt++)); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_name")" = healthy ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_name")" = healthy
          DATABASE_URL="$BIDS_COMMIT_TEST_DATABASE_URL" pnpm --filter @dkp/api exec prisma migrate deploy
          pnpm --filter @dkp/api exec jest --runInBand --testPathPattern=bids-commit.database.spec.ts

      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser business smoke
        env:
          AUTH_TEST_MODE: 'true'
          NODE_ENV: test
          SESSION_SECRET: ci-test-session-secret-at-least-32-characters
          CHECKIN_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: pnpm test:e2e

      - name: Audit dependencies
        run: pnpm audit --prod
