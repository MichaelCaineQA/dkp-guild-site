name: Deploy
on:
  # Автодеплой только SHA успешно завершившегося CI на main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Окружение GitHub с секретами сервера
        type: choice
        options: [staging, production]
        required: true
      release_tag:
        description: 'Тег релиза production (например v1.0.0); для staging оставьте пустым'
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    concurrency: deploy-${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Select production release tag from main
        if: inputs.environment == 'production'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: sh scripts/select-production-tag.sh
      - name: Require successful CI for selected SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          case "$sha" in *[!0-9a-f]*|'') echo 'Bad sha' >&2; exit 1;; esac
          # Фильтр status у API запусков изредка не отдаёт самый свежий запуск (#308),
          # поэтому запуски коммита берутся без него, а итог сверяется по полям ответа.
          passed=$(gh run list --workflow ci.yml --commit "$sha" --event push \
            --json headSha,status,conclusion \
            --jq '.[] | select(.status == "completed" and .conclusion == "success") | .headSha' \
            | grep -cx "$sha" || true)
          test "$passed" -gt 0 || { echo 'Selected SHA has no successful CI'; exit 1; }
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy selected commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          case "$DEPLOY_PATH" in /*) ;; *) echo 'DEPLOY_PATH must be absolute' >&2; exit 1;; esac
          # Путь ограничен безопасными символами: он передаётся удалённой оболочке.
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*|*..*) echo 'Invalid DEPLOY_PATH' >&2; exit 1;; esac
          # SHA заливаемого дерева передаём явно: git archive не содержит .git,
          # сам сервер rev-parse сделать не может (коммит в /api/health, #175).
          sha=$(git rev-parse --short=12 HEAD)
          case "$sha" in *[!0-9a-f]*) echo 'Bad sha' >&2; exit 1;; esac
          # Общая блокировка VPS: сборки двух стендов не конкурируют за память.
          # Архив распаковывается под той же блокировкой, что и сам deploy.
          git archive HEAD | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "flock /run/lock/dkp-deploy.lock sh -c 'mkdir -p \"$DEPLOY_PATH\" && tar -xf - -C \"$DEPLOY_PATH\" && cd \"$DEPLOY_PATH\" && GIT_SHA=$sha sh scripts/deploy-prod.sh'"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke on deployed SHA
        env:
          E2E_BASE_URL: ${{ inputs.environment == 'production' && 'https://suneclipse.ru' || 'https://stage.suneclipse.ru' }}
        run: E2E_EXPECTED_SHA=$(git rev-parse --short=12 HEAD) pnpm test:e2e
