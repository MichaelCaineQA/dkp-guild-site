name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Validate release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dkp
          POSTGRES_PASSWORD: dkp
          POSTGRES_DB: dkp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dkp -d dkp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://dkp:dkp@127.0.0.1:5432/dkp_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @dkp/api db:generate
      - name: Validate migrations
        run: pnpm --filter @dkp/api exec prisma migrate deploy
      - name: Seed test database
        env:
          NODE_ENV: test
        run: |
          pnpm db:seed
          pnpm db:seed:test
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: PostgreSQL integration tests
        env:
          ONBOARDING_TEST_DATABASE_URL: postgresql://dkp:dkp@127.0.0.1:5432/dkp_test?schema=public
        run: pnpm --filter @dkp/api exec jest --runInBand --testPathPattern=database.spec.ts
      - name: Build
        run: pnpm build
      - name: Verify installer and release packager
        run: |
          test -d installer
          bash -n scripts/release/package.sh
          python3 -m unittest discover -s installer -p 'test_*.py' -v

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set image names
        id: names
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/dkp-guild-api:${{ github.ref_name }}
            ghcr.io/${{ steps.names.outputs.owner }}/dkp-guild-api:latest
      - name: Build and push web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/dkp-guild-web:${{ github.ref_name }}
            ghcr.io/${{ steps.names.outputs.owner }}/dkp-guild-web:latest
      - name: Package release archive
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          RELEASE_OUTPUT_DIR="$RUNNER_TEMP/release" bash scripts/release/package.sh \
            "$VERSION" "$API_DIGEST" "$WEB_DIGEST"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"/* \
            --title "$GITHUB_REF_NAME" --generate-notes
