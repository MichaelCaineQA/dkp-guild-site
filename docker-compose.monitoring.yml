# Uptime Kuma — мониторинг доступности (PLAN.md §8 и этап 7, #305).
# Отдельный проект: база Kuma с мониторами лежит в своём томе, порты наружу
# не публикуются. Панель доступна только через edge Caddy, который
# подключается к сети dkp-monitoring_default (docker-compose.edge.yml).
name: dkp-monitoring
services:
  uptime-kuma:
    # Версия фиксирована: обновление — сознательная смена тега (README).
    image: louislam/uptime-kuma:2.5.12
    restart: unless-stopped
    environment:
      # Первый запуск без мастера выбора базы в браузере (/setup-database):
      # встроенная MariaDB — то же, что мастер предлагает по умолчанию.
      UPTIME_KUMA_DB_TYPE: embedded-mariadb
      UPTIME_KUMA_ENABLE_EMBEDDED_MARIADB: '1'
      # Время в оповещениях и панели — одно и то же, а не зона браузера
      # того, кто первым открыл панель после запуска.
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - uptime-kuma-data:/app/data
  # Оповещения ботом в личку Discord (#305): Kuma шлёт вебхук сюда, а
  # ретранслятор пишет от имени бота сайта. Отдельно от API сайта, чтобы
  # оповещение «API не отвечает» не зависело от самого API. Включается профилем
  # alerts (COMPOSE_PROFILES=alerts в .env.monitoring) вместе с его переменными.
  alert-relay:
    profiles: [alerts]
    image: node:22-alpine
    restart: unless-stopped
    user: node
    command: [node, /relay/alert-relay.mjs]
    environment:
      PORT: '8080'
      ALERT_RELAY_TOKEN: ${ALERT_RELAY_TOKEN:-}
      ALERT_BOT_TOKEN: ${ALERT_BOT_TOKEN:-}
      ALERT_DISCORD_USER_IDS: ${ALERT_DISCORD_USER_IDS:-}
      DISCORD_API_BASE: ${DISCORD_API_BASE:-https://discord.com/api/v10}
    volumes:
      - ./scripts/monitoring/alert-relay.mjs:/relay/alert-relay.mjs:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  uptime-kuma-data:
